<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Administrativo | Duleo Vidros</title>
  <link rel="stylesheet" href="/css/style.css?v=39">
</head>
<body>
  <section id="login" class="login card-form">
    <h3 class="logo"><img src="/img/logo-mark.png" alt="" width="52" height="37"><b>DULEO<span>VIDROS</span></b></h3>
    <p class="sub" style="margin:8px 0 20px">Acesso administrativo</p>
    <form id="form-login">
      <label>Senha<input type="password" id="senha" required autocomplete="current-password"></label>
      <p class="form-msg err" id="login-msg" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>

  <main id="painel" class="admin-wrap hidden">
    <div class="container">
      <div class="foot">
        <h2>Painel</h2>
        <button class="btn btn-ghost btn-sm" id="sair">Sair</button>
      </div>
      <div class="tabs" id="tabs">
        <button data-tab="orcamentos" class="on">Orçamentos</button>
        <button data-tab="contatos">Contatos</button>
        <button data-tab="clientes">Clientes</button>
      </div>
      <div class="table-wrap"><table id="tabela"></table></div>
    </div>
  </main>
  <script src="/admin/admin.js?v=39"></script>
</body>
</html>
